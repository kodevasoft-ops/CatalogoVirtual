<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Catálogo Virtual</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
:root{
  --primary:#b8c0ff;--primary-dark:#8892f0;--secondary:#ffd6e0;
  --bg:#f5f4ff;--card:#fff;--text:#2d2d3a;--text2:#6b6b80;
  --shadow:rgba(120,100,200,.10);--shadow2:rgba(120,100,200,.18);
  --radius:22px;--radius-sm:14px;--nav-h:70px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* ── DESKTOP HEADER ── */
.header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.88);
  backdrop-filter:blur(16px);border-bottom:1px solid rgba(184,192,255,.25);
  padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between}
.header-logo{display:flex;align-items:center;gap:10px}
.logo-dot{width:34px;height:34px;border-radius:50%;
  background:linear-gradient(135deg,var(--primary),var(--secondary));
  display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff}
.header h1{font-family:'Playfair Display',serif;font-size:20px;font-weight:500}
.header-actions{display:flex;align-items:center;gap:10px}
.btn-icon{width:40px;height:40px;border-radius:50%;border:none;background:var(--bg);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:18px;color:var(--text2);transition:.2s;position:relative}
.btn-icon:hover{background:var(--primary);color:#fff}
.cart-badge{position:absolute;top:-2px;right:-2px;background:#ff6b9d;color:#fff;
  font-size:10px;font-weight:600;width:16px;height:16px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transform:scale(0);transition:.2s}
.cart-badge.show{opacity:1;transform:scale(1)}

/* ── HERO ── */
.hero{padding:48px 24px 24px;text-align:center}
.hero h2{font-family:'Playfair Display',serif;font-size:clamp(28px,5vw,44px);font-weight:500;line-height:1.2;margin-bottom:10px}
.hero p{color:var(--text2);font-size:15px;margin-bottom:28px}
.search-bar{max-width:520px;margin:0 auto 20px;background:#fff;border-radius:50px;
  border:1.5px solid rgba(184,192,255,.4);display:flex;align-items:center;
  padding:8px 8px 8px 20px;box-shadow:0 4px 24px var(--shadow)}
.search-bar i{color:var(--text2);font-size:20px;margin-right:10px}
.search-bar input{border:none;outline:none;flex:1;font-family:'DM Sans',sans-serif;
  font-size:14px;background:transparent;color:var(--text)}
.search-btn{background:var(--primary);border:none;color:#fff;padding:9px 20px;
  border-radius:40px;font-size:13px;font-weight:500;cursor:pointer;transition:.2s;font-family:'DM Sans',sans-serif}
.search-btn:hover{background:var(--primary-dark)}

/* ── FILTERS ── */
.filters{display:flex;gap:8px;flex-wrap:wrap;padding:0 24px 20px;justify-content:center}
.filter-btn{padding:7px 18px;border-radius:50px;border:1.5px solid rgba(184,192,255,.5);
  background:#fff;color:var(--text2);font-size:13px;font-weight:500;
  cursor:pointer;transition:.2s;font-family:'DM Sans',sans-serif}
.filter-btn:hover,.filter-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}

/* ── GRID ── */
.products-section{padding:0 20px 40px}
.section-label{font-size:13px;font-weight:600;text-transform:uppercase;
  letter-spacing:.08em;color:var(--text2);margin-bottom:16px;padding:0 4px}
.products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}

/* ── CARD ── */
.card{background:var(--card);border-radius:var(--radius);box-shadow:0 4px 20px var(--shadow);
  overflow:hidden;transition:transform .3s,box-shadow .3s;cursor:pointer;animation:fadeUp .5s ease both}
.card:hover{transform:translateY(-6px);box-shadow:0 12px 40px var(--shadow2)}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.card-img-wrap{position:relative;height:200px;overflow:hidden;background:linear-gradient(135deg,#f0f0ff,#ffe8f0)}
.card-img-wrap img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.card:hover .card-img-wrap img{transform:scale(1.06)}
.card-img-placeholder{width:100%;height:100%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:8px;color:#c0b8e0;font-size:36px}
.card-img-placeholder span{font-size:12px;color:#c0b8e0}
.card-badge{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.92);
  backdrop-filter:blur(8px);border-radius:50px;padding:4px 12px;font-size:11px;font-weight:600;color:var(--text2)}
.card-content{padding:16px}
.card-content h3{font-size:15px;font-weight:600;margin-bottom:4px;line-height:1.3}
.card-content .desc{font-size:12px;color:var(--text2);margin-bottom:12px;line-height:1.5;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card-footer{display:flex;align-items:center;justify-content:space-between}
.price{font-size:18px;font-weight:700}
.add-btn{width:38px;height:38px;border-radius:50%;background:var(--primary);border:none;
  color:#fff;font-size:20px;cursor:pointer;transition:.2s;
  display:flex;align-items:center;justify-content:center}
.add-btn:hover{background:var(--primary-dark);transform:scale(1.1)}
.add-btn:active{transform:scale(.95)}

/* ── EMPTY STATE ── */
.empty-state{text-align:center;padding:80px 20px;color:var(--text2)}
.empty-state i{font-size:52px;margin-bottom:12px;opacity:.4}
.empty-state p{font-size:14px}

/* ── OVERLAY ── */
.overlay{position:fixed;inset:0;z-index:200;background:rgba(30,20,60,.35);
  backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:.3s}
.overlay.show{opacity:1;pointer-events:all}

/* ── CART PANEL (desktop sidebar) ── */
.cart-panel{position:fixed;right:0;top:0;bottom:0;z-index:201;
  width:min(420px,100vw);background:#fff;border-radius:24px 0 0 24px;
  box-shadow:-8px 0 40px rgba(100,80,200,.15);display:flex;flex-direction:column;
  transform:translateX(110%);transition:.35s cubic-bezier(.4,0,.2,1)}
.cart-panel.show{transform:translateX(0)}
.cart-header{padding:20px 24px 16px;border-bottom:1px solid rgba(184,192,255,.2);
  display:flex;align-items:center;justify-content:space-between}
.cart-header h2{font-family:'Playfair Display',serif;font-size:20px;font-weight:500}
.close-btn{width:36px;height:36px;border-radius:50%;border:none;background:var(--bg);
  cursor:pointer;font-size:18px;color:var(--text2);transition:.2s;
  display:flex;align-items:center;justify-content:center}
.close-btn:hover{background:#ffd6e0}
.cart-items{flex:1;overflow-y:auto;padding:16px 24px}
.cart-item{display:flex;align-items:center;gap:14px;padding:12px 0;
  border-bottom:1px solid rgba(184,192,255,.15)}
.cart-item-img{width:54px;height:54px;border-radius:14px;object-fit:cover;
  background:linear-gradient(135deg,#f0f0ff,#ffe8f0);flex-shrink:0}
.cart-item-img.placeholder{display:flex;align-items:center;justify-content:center;font-size:20px;color:#c0b8e0}
.cart-item-info{flex:1}
.cart-item-info h4{font-size:14px;font-weight:600;margin-bottom:2px}
.cart-item-info .item-price{font-size:13px;color:var(--text2)}
.cart-qty{display:flex;align-items:center;gap:8px}
.qty-btn{width:26px;height:26px;border-radius:50%;border:1.5px solid rgba(184,192,255,.5);
  background:#fff;cursor:pointer;font-size:14px;font-weight:600;color:var(--text2);
  transition:.2s;display:flex;align-items:center;justify-content:center;line-height:1}
.qty-btn:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.qty-num{font-size:14px;font-weight:600;min-width:20px;text-align:center}
.remove-item{color:#ffb3c6;background:none;border:none;cursor:pointer;font-size:18px;padding:4px;transition:.2s}
.remove-item:hover{color:#ff6b9d}
.cart-footer{padding:16px 24px 24px;border-top:1px solid rgba(184,192,255,.2)}
.cart-total{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.cart-total span{font-size:14px;color:var(--text2)}
.cart-total strong{font-size:22px;font-weight:700}
.whatsapp-btn{width:100%;padding:15px;border-radius:var(--radius);border:none;cursor:pointer;
  background:linear-gradient(135deg,#25d366,#128c7e);color:#fff;font-size:15px;font-weight:600;
  font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;gap:10px;
  transition:.2s;box-shadow:0 4px 20px rgba(37,211,102,.35)}
.whatsapp-btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(37,211,102,.5)}
.whatsapp-btn i{font-size:22px}

/* ── ADMIN LOGIN ── */
.admin-login-overlay{display:none;position:fixed;inset:0;z-index:300;
  background:rgba(30,20,60,.5);backdrop-filter:blur(8px);
  align-items:center;justify-content:center}
.admin-login-overlay.show{display:flex}
.login-card{background:#fff;border-radius:var(--radius);padding:40px;width:min(380px,90vw);
  box-shadow:0 20px 60px rgba(100,80,200,.2);animation:popIn .3s cubic-bezier(.4,0,.2,1)}
@keyframes popIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
.login-card h2{font-family:'Playfair Display',serif;font-size:26px;margin-bottom:6px}
.login-card p{color:var(--text2);font-size:14px;margin-bottom:28px}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:var(--text2)}
.form-group input,.form-group textarea{
  width:100%;padding:12px 16px;border:1.5px solid rgba(184,192,255,.4);
  border-radius:var(--radius-sm);font-family:'DM Sans',sans-serif;font-size:14px;
  outline:none;transition:.2s;color:var(--text);background:#fafaff}
.form-group input:focus,.form-group textarea:focus{border-color:var(--primary);background:#fff}
.form-group textarea{min-height:80px;resize:vertical}
.btn-primary{width:100%;padding:13px;border-radius:var(--radius);border:none;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff;font-size:15px;font-weight:600;font-family:'DM Sans',sans-serif;
  cursor:pointer;transition:.2s;box-shadow:0 4px 20px rgba(136,146,240,.4)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(136,146,240,.5)}
.btn-cancel{width:100%;padding:11px;border-radius:var(--radius);
  border:1.5px solid rgba(184,192,255,.5);background:transparent;color:var(--text2);
  font-size:14px;font-weight:500;font-family:'DM Sans',sans-serif;cursor:pointer;margin-top:10px;transition:.2s}
.btn-cancel:hover{background:var(--bg)}

/* ── ADMIN PANEL ── */
.admin-panel{display:none;position:fixed;inset:0;z-index:300;background:var(--bg);overflow-y:auto}
.admin-panel.show{display:block}
.admin-nav{background:#fff;padding:0 24px;height:64px;display:flex;align-items:center;
  justify-content:space-between;border-bottom:1px solid rgba(184,192,255,.25);
  position:sticky;top:0;z-index:10}
.admin-nav h1{font-family:'Playfair Display',serif;font-size:18px;font-weight:500}
.admin-nav-actions{display:flex;gap:10px}
.btn-sm{padding:8px 18px;border-radius:50px;font-size:13px;font-weight:500;
  font-family:'DM Sans',sans-serif;cursor:pointer;transition:.2s;display:flex;align-items:center;gap:6px}
.btn-add{background:var(--primary);color:#fff;border:none;box-shadow:0 2px 12px rgba(136,146,240,.35)}
.btn-add:hover{background:var(--primary-dark)}
.btn-exit{background:transparent;color:var(--text2);border:1.5px solid rgba(184,192,255,.5)}
.btn-exit:hover{background:#ffd6e0;border-color:#ffd6e0;color:#c05070}
.admin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;padding:24px}
.admin-card{background:#fff;border-radius:var(--radius);box-shadow:0 4px 20px var(--shadow);overflow:hidden;animation:fadeUp .4s ease both}
.admin-card-img{height:160px;background:linear-gradient(135deg,#f0f0ff,#ffe8f0);position:relative;overflow:hidden}
.admin-card-img img{width:100%;height:100%;object-fit:cover}
.admin-card-img .placeholder-icon{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:40px;color:#c0b8e0}
.admin-card-body{padding:14px}
.admin-card-body h3{font-size:14px;font-weight:600;margin-bottom:2px}
.admin-card-body .cat-tag{display:inline-block;padding:2px 10px;background:rgba(184,192,255,.2);
  border-radius:50px;font-size:11px;color:var(--primary-dark);margin-bottom:8px}
.admin-card-body .p-price{font-weight:700;font-size:16px}
.admin-card-actions{display:flex;gap:8px;margin-top:10px}
.btn-edit{flex:1;padding:8px;border-radius:var(--radius-sm);border:1.5px solid rgba(184,192,255,.5);
  background:transparent;color:var(--primary-dark);font-size:13px;font-weight:500;
  font-family:'DM Sans',sans-serif;cursor:pointer;transition:.2s;
  display:flex;align-items:center;justify-content:center;gap:5px}
.btn-edit:hover{background:rgba(184,192,255,.15)}
.btn-delete{padding:8px 14px;border-radius:var(--radius-sm);border:1.5px solid #ffd6e0;
  background:transparent;color:#ff6b9d;font-size:13px;cursor:pointer;transition:.2s;
  display:flex;align-items:center;justify-content:center}
.btn-delete:hover{background:#ffd6e0}

/* ── PRODUCT MODAL ── */
.modal-overlay{display:none;position:fixed;inset:0;z-index:400;
  background:rgba(30,20,60,.45);backdrop-filter:blur(6px);
  align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal-box{background:#fff;border-radius:var(--radius);width:min(520px,100%);
  max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(100,80,200,.2);
  animation:popIn .3s cubic-bezier(.4,0,.2,1)}
.modal-header{padding:24px 24px 0;display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.modal-header h2{font-family:'Playfair Display',serif;font-size:22px;font-weight:500}
.modal-body{padding:0 24px 24px}
.img-upload-zone{border:2px dashed rgba(184,192,255,.5);border-radius:var(--radius-sm);height:180px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  cursor:pointer;transition:.2s;margin-bottom:16px;position:relative;overflow:hidden;background:#fafaff}
.img-upload-zone:hover{border-color:var(--primary);background:#f4f4ff}
.img-upload-zone i{font-size:36px;color:var(--primary)}
.img-upload-zone span{font-size:13px;color:var(--text2)}
.img-upload-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.img-preview{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;border-radius:calc(var(--radius-sm) - 2px)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
.modal-footer{display:flex;gap:10px;padding:0 24px 24px}
.modal-footer .btn-primary,.modal-footer .btn-cancel{flex:1;margin-top:0}

/* ── DETAIL MODAL ── */
.detail-modal-overlay{display:none;position:fixed;inset:0;z-index:400;
  background:rgba(30,20,60,.45);backdrop-filter:blur(6px);
  align-items:center;justify-content:center;padding:20px}
.detail-modal-overlay.show{display:flex}
.detail-box{background:#fff;border-radius:var(--radius);width:min(480px,100%);
  max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(100,80,200,.2);
  animation:popIn .3s cubic-bezier(.4,0,.2,1)}
.detail-img{width:100%;height:260px;object-fit:cover}
.detail-img-placeholder{width:100%;height:260px;background:linear-gradient(135deg,#f0f0ff,#ffe8f0);
  display:flex;align-items:center;justify-content:center;font-size:60px;color:#c0b8e0}
.detail-content{padding:20px 24px 28px}
.detail-cat{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--primary-dark);margin-bottom:8px}
.detail-content h2{font-family:'Playfair Display',serif;font-size:24px;font-weight:500;margin-bottom:8px}
.detail-content .detail-price{font-size:28px;font-weight:700;margin-bottom:12px}
.detail-content .detail-desc{font-size:14px;color:var(--text2);line-height:1.7;margin-bottom:20px}
.detail-actions{display:flex;gap:12px}
.detail-add-btn{flex:1;padding:14px;border-radius:var(--radius);
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  border:none;color:#fff;font-size:15px;font-weight:600;font-family:'DM Sans',sans-serif;
  cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 4px 20px rgba(136,146,240,.4)}
.detail-add-btn:hover{transform:translateY(-2px)}
.detail-close-btn{padding:14px 18px;border-radius:var(--radius);
  border:1.5px solid rgba(184,192,255,.4);background:transparent;color:var(--text2);cursor:pointer;font-size:18px;transition:.2s}
.detail-close-btn:hover{background:var(--bg)}

/* ── TOAST ── */
.toast-container{position:fixed;bottom:24px;right:24px;z-index:500;
  display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{background:#fff;border-radius:var(--radius-sm);padding:12px 18px;
  box-shadow:0 8px 30px var(--shadow2);display:flex;align-items:center;gap:10px;
  font-size:14px;font-weight:500;border-left:4px solid var(--primary);
  animation:slideIn .3s ease;pointer-events:all}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.toast.success{border-left-color:#25d366}
.toast.error{border-left-color:#ff6b9d}

/* ── MOBILE TOP BAR ── */
.mobile-topbar{display:none}

/* ── BOTTOM NAV ── */
.bottom-nav{display:none}

/* ════════════════════════════════════════
   MOBILE ≤ 860px  —  NATIVE APP LAYOUT
   ════════════════════════════════════════ */
@media(max-width:860px){

  /* Esconder header desktop */
  .header{display:none}

  /* Padding inferior para la nav bar */
  body{padding-bottom:var(--nav-h);background:#f5f4ff}

  /* ── TOP APP BAR ── */
  .mobile-topbar{
    display:flex;position:sticky;top:0;z-index:100;
    height:56px;background:rgba(255,255,255,.96);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-bottom:1px solid rgba(184,192,255,.2);
    align-items:center;padding:0 16px;gap:12px;
  }
  .topbar-logo{width:32px;height:32px;border-radius:10px;flex-shrink:0;
    background:linear-gradient(135deg,var(--primary),var(--secondary));
    display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff}
  .topbar-title{font-family:'Playfair Display',serif;font-size:17px;font-weight:500;flex:1}
  .topbar-btn{width:38px;height:38px;border-radius:50%;border:none;background:var(--bg);
    display:flex;align-items:center;justify-content:center;
    font-size:18px;color:var(--text2);cursor:pointer;position:relative;flex-shrink:0;transition:.15s}
  .topbar-btn:active{background:var(--primary);color:#fff;transform:scale(.93)}

  /* ── HERO COMPACTO ── */
  .hero{padding:18px 16px 12px;text-align:left}
  .hero h2{font-size:22px;margin-bottom:4px}
  .hero p{font-size:13px;margin-bottom:14px}
  .search-bar{max-width:100%;margin:0;padding:8px 8px 8px 16px;
    border-radius:14px;box-shadow:0 2px 12px var(--shadow)}
  .search-btn{padding:8px 14px;font-size:12px}

  /* ── FILTROS SCROLL HORIZONTAL ── */
  .filters{flex-wrap:nowrap;overflow-x:auto;padding:10px 16px 14px;
    scrollbar-width:none;gap:8px;justify-content:flex-start;
    -webkit-overflow-scrolling:touch}
  .filters::-webkit-scrollbar{display:none}
  .filter-btn{white-space:nowrap;flex-shrink:0;padding:6px 16px;font-size:12px}

  /* ── GRID 2 COLS ── */
  .products-section{padding:0 12px calc(var(--nav-h) + 16px)}
  .section-label{font-size:11px;margin-bottom:12px;padding:0 2px}
  .products-grid{grid-template-columns:1fr 1fr;gap:10px}

  /* ── CARD APP-STYLE ── */
  .card{border-radius:18px;box-shadow:0 2px 12px var(--shadow)}
  .card:hover{transform:none}
  .card:active{transform:scale(.96);transition:.1s}
  .card-img-wrap{height:148px}
  .card-content{padding:11px 12px 12px}
  .card-content h3{font-size:13px;font-weight:600;margin-bottom:3px}
  .card-content .desc{font-size:11px;margin-bottom:9px}
  .price{font-size:15px}
  .add-btn{width:32px;height:32px;font-size:17px}
  .card-badge{font-size:10px;padding:3px 9px;top:8px;left:8px}

  /* ── BOTTOM NAVIGATION BAR ── */
  .bottom-nav{
    display:flex;position:fixed;bottom:0;left:0;right:0;z-index:100;
    height:var(--nav-h);background:rgba(255,255,255,.97);
    backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    border-top:1px solid rgba(184,192,255,.2);
    padding:0 4px;padding-bottom:env(safe-area-inset-bottom,0px);
    align-items:center;justify-content:space-around;
    box-shadow:0 -4px 20px rgba(120,100,200,.08);
  }
  .nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;padding:8px 0;border-radius:16px;cursor:pointer;border:none;
    background:transparent;flex:1;position:relative;transition:.15s;min-height:52px}
  .nav-item i{font-size:22px;color:var(--text2);transition:.15s}
  .nav-item span{font-size:10px;font-weight:500;color:var(--text2);transition:.15s}
  .nav-item.active i,.nav-item.active span{color:var(--primary-dark)}
  .nav-item.active{background:rgba(184,192,255,.13)}
  .nav-dot{position:absolute;top:7px;right:calc(50% - 18px);
    background:#ff6b9d;color:#fff;font-size:9px;font-weight:700;
    width:15px;height:15px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    opacity:0;transform:scale(0);transition:.2s}
  .nav-dot.show{opacity:1;transform:scale(1)}

  /* ── CARRITO: BOTTOM SHEET ── */
  .cart-panel{top:auto;right:0;left:0;bottom:0;width:100%;
    border-radius:26px 26px 0 0;transform:translateY(110%);
    transition:.35s cubic-bezier(.4,0,.2,1);max-height:88vh}
  .cart-panel.show{transform:translateY(0)}
  .cart-header{padding:10px 20px 14px;flex-direction:column;align-items:stretch;gap:0}
  .cart-header::before{content:'';display:block;width:36px;height:4px;border-radius:4px;
    background:rgba(184,192,255,.5);margin:0 auto 12px}
  .cart-header-row{display:flex;align-items:center;justify-content:space-between}
  .cart-header h2{font-size:18px}
  .cart-items{padding:10px 20px}
  .cart-item{padding:10px 0}
  .cart-item-img{width:48px;height:48px;border-radius:12px}
  .cart-footer{padding:12px 20px calc(env(safe-area-inset-bottom,0px) + 16px)}
  .cart-total strong{font-size:20px}

  /* ── DETAIL: BOTTOM SHEET ── */
  .detail-modal-overlay{align-items:flex-end;padding:0}
  .detail-box{width:100%;border-radius:26px 26px 0 0;max-height:92vh;
    animation:sheetUp .3s cubic-bezier(.4,0,.2,1)}
  @keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .detail-img{height:210px}
  .detail-img-placeholder{height:210px}
  .detail-content{padding:16px 20px calc(env(safe-area-inset-bottom,0px) + 24px)}
  .detail-content h2{font-size:20px}
  .detail-content .detail-price{font-size:24px}

  /* ── MODAL PRODUCTO: BOTTOM SHEET ── */
  .modal-overlay{align-items:flex-end;padding:0}
  .modal-box{width:100%;border-radius:26px 26px 0 0;max-height:94vh;
    animation:sheetUp .3s cubic-bezier(.4,0,.2,1)}
  .form-grid{grid-template-columns:1fr}

  /* ── ADMIN MÓVIL ── */
  .admin-nav{height:56px;padding:0 16px}
  .admin-nav h1{font-size:16px}
  .btn-sm{padding:7px 14px;font-size:12px}
  .admin-grid{grid-template-columns:1fr 1fr;gap:10px;padding:14px}
  .admin-card-img{height:110px}
  .admin-card-body{padding:11px}
  .admin-card-body h3{font-size:13px}

  /* Toasts sobre la nav bar */
  .toast-container{bottom:calc(var(--nav-h) + 12px);right:12px;left:12px;align-items:stretch}
  .toast{border-radius:14px;font-size:13px}
}

@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- ══ MOBILE TOP BAR ══ -->
<div class="mobile-topbar" id="mobileTopbar">
  <div class="topbar-logo"><i class='bx bx-store'></i></div>
  <span class="topbar-title">Mi Catálogo</span>
  <button class="topbar-btn" onclick="triggerAdmin()"><i class='bx bx-shield-quarter'></i></button>
  <button class="topbar-btn" id="mobileCartBtn" style="position:relative">
    <i class='bx bx-cart'></i>
    <span class="cart-badge" id="cartBadgeMobile">0</span>
  </button>
</div>

<!-- ══ DESKTOP HEADER ══ -->
<header class="header">
  <div class="header-logo">
    <div class="logo-dot"><i class='bx bx-store'></i></div>
    <h1>Mi Catálogo</h1>
  </div>
  <div class="header-actions">
    <button class="btn-icon" onclick="triggerAdmin()"><i class='bx bx-shield-quarter'></i></button>
    <button class="btn-icon" id="cartBtn">
      <i class='bx bx-cart'></i>
      <span class="cart-badge" id="cartBadge">0</span>
    </button>
  </div>
</header>

<!-- ══ HERO + SEARCH ══ -->
<section class="hero">
  <h2>Descubre productos<br>increíbles ✨</h2>
  <p>Encuentra lo que buscas y pide por WhatsApp</p>
  <div class="search-bar">
    <i class='bx bx-search'></i>
    <input type="text" id="searchInput" placeholder="Buscar productos…">
    <button class="search-btn" onclick="performSearch()">Buscar</button>
  </div>
</section>

<!-- ══ FILTERS ══ -->
<div class="filters" id="filtersContainer"></div>

<!-- ══ PRODUCTS ══ -->
<section class="products-section">
  <div class="section-label" id="sectionLabel">Todos los productos</div>
  <div class="products-grid" id="productsGrid">
    <div class="empty-state" style="grid-column:1/-1">
      <i class='bx bx-loader-circle' style="animation:spin 1s linear infinite"></i>
      <p>Cargando productos…</p>
    </div>
  </div>
</section>

<!-- ══ OVERLAY ══ -->
<div class="overlay" id="overlay" onclick="closeCart()"></div>

<!-- ══ CART PANEL ══ -->
<div class="cart-panel" id="cartPanel">
  <div class="cart-header">
    <div class="cart-header-row">
      <h2>Tu carrito 🛍️</h2>
      <button class="close-btn" onclick="closeCart()"><i class='bx bx-x'></i></button>
    </div>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-footer">
    <div class="cart-total">
      <span>Total</span>
      <strong id="cartTotal">$0</strong>
    </div>
    <button class="whatsapp-btn" onclick="sendWhatsApp()">
      <i class='bx bxl-whatsapp'></i>Enviar pedido por WhatsApp
    </button>
  </div>
</div>

<!-- ══ BOTTOM NAV ══ -->
<nav class="bottom-nav">
  <button class="nav-item active" id="navHome" onclick="setNav('navHome')">
    <i class='bx bx-store-alt'></i><span>Inicio</span>
  </button>
  <button class="nav-item" id="navSearch" onclick="setNav('navSearch');focusSearch()">
    <i class='bx bx-search'></i><span>Buscar</span>
  </button>
  <button class="nav-item" id="navCart" onclick="setNav('navCart');openCart()">
    <i class='bx bx-cart'></i><span>Carrito</span>
    <span class="nav-dot" id="navDot">0</span>
  </button>
  <button class="nav-item" id="navAdmin" onclick="setNav('navAdmin');triggerAdmin()">
    <i class='bx bx-shield-quarter'></i><span>Admin</span>
  </button>
</nav>

<!-- ══ ADMIN LOGIN ══ -->
<div class="admin-login-overlay" id="adminLoginOverlay">
  <div class="login-card">
    <h2>Panel Admin 🔐</h2>
    <p>Ingresa tus credenciales</p>
    <div class="form-group">
      <label>Usuario</label>
      <input type="text" id="loginUser" placeholder="admin">
    </div>
    <div class="form-group">
      <label>Contraseña</label>
      <input type="password" id="loginPass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn-primary" onclick="doLogin()">Ingresar</button>
    <button class="btn-cancel" onclick="closeAdminLogin()">Cancelar</button>
  </div>
</div>

<!-- ══ ADMIN PANEL ══ -->
<div class="admin-panel" id="adminPanel">
  <nav class="admin-nav">
    <h1>Administrador</h1>
    <div class="admin-nav-actions">
      <button class="btn-sm btn-add" onclick="openProductModal()"><i class='bx bx-plus'></i>Nuevo</button>
      <button class="btn-sm btn-exit" onclick="exitAdmin()"><i class='bx bx-log-out'></i>Salir</button>
    </div>
  </nav>
  <div class="admin-grid" id="adminGrid"></div>
</div>

<!-- ══ PRODUCT MODAL ══ -->
<div class="modal-overlay" id="productModal">
  <div class="modal-box">
    <div class="modal-header">
      <h2 id="modalTitle">Nuevo Producto</h2>
      <button class="close-btn" onclick="closeProductModal()"><i class='bx bx-x'></i></button>
    </div>
    <div class="modal-body">
      <div class="img-upload-zone" id="uploadZone" onclick="triggerFileInput()">
        <i class='bx bx-image-add'></i>
        <span>Toca para subir imagen</span>
        <span style="font-size:11px;color:#c0b8e0">PNG, JPG · Máx 5MB</span>
        <input type="file" id="imgInput" accept="image/*" onchange="previewImage(event)">
      </div>
      <div class="form-grid">
        <div class="form-group full"><label>Nombre *</label><input type="text" id="pName" placeholder="Ej: Collar de perlas"></div>
        <div class="form-group"><label>Precio *</label><input type="number" id="pPrice" placeholder="25000"></div>
        <div class="form-group"><label>Categoría</label><input type="text" id="pCategory" placeholder="Ej: Joyería"></div>
        <div class="form-group full"><label>Descripción</label><textarea id="pDesc" placeholder="Describe el producto…"></textarea></div>
        <div class="form-group full"><label>URL Imagen Drive</label><input type="text" id="pImgUrl" placeholder="https://drive.google.com/uc?export=view&id=..."></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeProductModal()">Cancelar</button>
      <button class="btn-primary" onclick="saveProduct()">Guardar</button>
    </div>
  </div>
</div>

<!-- ══ DETAIL MODAL ══ -->
<div class="detail-modal-overlay" id="detailModal">
  <div class="detail-box">
    <div id="detailImgContainer"></div>
    <div class="detail-content">
      <div class="detail-cat" id="detailCat"></div>
      <h2 id="detailName"></h2>
      <div class="detail-price" id="detailPrice"></div>
      <div class="detail-desc" id="detailDesc"></div>
      <div class="detail-actions">
        <button class="detail-close-btn" onclick="closeDetail()"><i class='bx bx-x'></i></button>
        <button class="detail-add-btn" id="detailAddBtn"><i class='bx bx-cart-add'></i>Agregar al carrito</button>
      </div>
    </div>
  </div>
</div>

<!-- ══ TOASTS ══ -->
<div class="toast-container" id="toastContainer"></div>

<script>
// ── CONFIG ──
const CONFIG={
  APPS_SCRIPT_URL:'https://script.google.com/macros/s/AKfycbwepZdLcFmi1qhSnO3ezUpsRp1cfharE9H2z-e6WWIH6AoBLPWzjrrUqwPnxIeUS0st/exec',
  WHATSAPP_NUMBER:'573174485239',
    ADMIN_USER:'admin',
  ADMIN_PASS:'admin123',
  USE_DEMO_DATA:true
};
const isConfigured=CONFIG.APPS_SCRIPT_URL!=='https://script.google.com/macros/s/AKfycbwepZdLcFmi1qhSnO3ezUpsRp1cfharE9H2z-e6WWIH6AoBLPWzjrrUqwPnxIeUS0st/exec';

// ── DEMO ──
const DEMO=[
  {id:'1',name:'Collar Floral',price:35000,description:'Hermoso collar artesanal con flores secas encapsuladas en resina. Perfecto para regalar o lucir en cualquier ocasión.',image:'',category:'Joyería'},
  {id:'2',name:'Pulsera Pastel',price:18000,description:'Pulsera tejida a mano con hilo encerado premium. Disponible en varios colores pasteles.',image:'',category:'Joyería'},
  {id:'3',name:'Bolso Mini Crema',price:85000,description:'Bolso mini con asa corta de cuero vegano. Interior con divisiones y cierre magnético.',image:'',category:'Bolsos'},
  {id:'4',name:'Candle Set Lavanda',price:42000,description:'Set de 3 velas aromáticas de lavanda y vainilla. 100% cera de soya, mecha de algodón.',image:'',category:'Hogar'},
  {id:'5',name:'Agenda Floral 2025',price:28000,description:'Agenda semanal tapa dura ilustrada. Páginas de alta gramaje con marcadores de colores incluidos.',image:'',category:'Papelería'},
  {id:'6',name:'Tote Bag Lino',price:32000,description:'Bolsa de lino natural estampada a mano. Ideal para compras, playa o uso diario.',image:'',category:'Bolsos'},
];

// ── STATE ──
let all=[],filtered=[],cart=JSON.parse(localStorage.getItem('cart')||'[]');
let editingId=null,imgB64=null;
const cats=new Set();

// ── INIT ──
document.addEventListener('DOMContentLoaded',()=>{
  loadProducts();
  updateBadges();
  document.getElementById('searchInput').addEventListener('input',performSearch);
  document.getElementById('cartBtn').onclick=openCart;
  document.getElementById('mobileCartBtn').onclick=openCart;
});

// ── NAV ──
function setNav(id){
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
  const el=document.getElementById(id);
  if(el)el.classList.add('active');
}
function focusSearch(){
  const el=document.getElementById('searchInput');
  el.scrollIntoView({behavior:'smooth',block:'center'});
  setTimeout(()=>el.focus(),350);
}
function triggerAdmin(){
  if(sessionStorage.getItem('adminLogged')==='true'){openAdminPanel();return;}
  document.getElementById('adminLoginOverlay').classList.add('show');
  setTimeout(()=>document.getElementById('loginUser').focus(),200);
}

// ── LOAD ──
async function loadProducts(){
  if(!isConfigured||CONFIG.USE_DEMO_DATA){
    all=[...DEMO];filtered=[...all];buildFilters();renderProducts(filtered);return;
  }
  try{
    const r=await fetch(CONFIG.APPS_SCRIPT_URL+'?action=getProducts');
    const d=await r.json();
    if(d.success){all=d.data;filtered=[...all];buildFilters();renderProducts(filtered);}
  }catch(e){
    all=[...DEMO];filtered=[...all];buildFilters();renderProducts(filtered);
  }
}

// ── FILTERS ──
function buildFilters(){
  cats.clear();all.forEach(p=>p.category&&cats.add(p.category));
  const c=document.getElementById('filtersContainer');
  const list=Array.from(cats);
  if(!list.length){c.style.display='none';return;}
  c.innerHTML=`<button class="filter-btn active" onclick="filterBy('all',this)">Todos</button>`+
    list.map(x=>`<button class="filter-btn" onclick="filterBy('${x}',this)">${x}</button>`).join('');
}
function filterBy(cat,el){
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  filtered=cat==='all'?[...all]:all.filter(p=>p.category===cat);
  document.getElementById('sectionLabel').textContent=`${cat==='all'?'Todos los productos':cat} (${filtered.length})`;
  renderProducts(filtered);
}
function performSearch(){
  const q=document.getElementById('searchInput').value.toLowerCase().trim();
  if(!q){renderProducts(filtered.length?filtered:all);return;}
  const r=all.filter(p=>p.name.toLowerCase().includes(q)||(p.description&&p.description.toLowerCase().includes(q))||(p.category&&p.category.toLowerCase().includes(q)));
  renderProducts(r);
  document.getElementById('sectionLabel').textContent=`"${q}" (${r.length})`;
}

// ── RENDER ──
function renderProducts(list){
  const g=document.getElementById('productsGrid');
  if(!list.length){g.innerHTML=`<div class="empty-state" style="grid-column:1/-1"><i class='bx bx-package'></i><p>No se encontraron productos</p></div>`;return;}
  g.innerHTML=list.map((p,i)=>`
    <div class="card" style="animation-delay:${i*.07}s" onclick="openDetail('${p.id}')">
      <div class="card-img-wrap">
        ${p.image?`<img src="${p.image}" alt="${p.name}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`:'' }
        <div class="card-img-placeholder" style="${p.image?'display:none':''}"><i class='bx bx-image'></i><span>${p.category||''}</span></div>
        ${p.category?`<span class="card-badge">${p.category}</span>`:''}
      </div>
      <div class="card-content">
        <h3>${p.name}</h3>
        <p class="desc">${p.description||'Sin descripción.'}</p>
        <div class="card-footer">
          <div class="price">${fmt(p.price)}</div>
          <button class="add-btn" onclick="event.stopPropagation();addToCart('${p.id}')"><i class='bx bx-plus'></i></button>
        </div>
      </div>
    </div>`).join('');
}

// ── DETAIL ──
function openDetail(id){
  const p=all.find(x=>x.id==id);if(!p)return;
  document.getElementById('detailImgContainer').innerHTML=p.image
    ?`<img class="detail-img" src="${p.image}" alt="${p.name}" onerror="this.style.display='none'">`
    :`<div class="detail-img-placeholder"><i class='bx bx-image'></i></div>`;
  document.getElementById('detailCat').textContent=p.category||'';
  document.getElementById('detailName').textContent=p.name;
  document.getElementById('detailPrice').textContent=fmt(p.price);
  document.getElementById('detailDesc').textContent=p.description||'Sin descripción.';
  document.getElementById('detailAddBtn').onclick=()=>{addToCart(id);closeDetail();};
  document.getElementById('detailModal').classList.add('show');
}
function closeDetail(){document.getElementById('detailModal').classList.remove('show');}
document.getElementById('detailModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeDetail();});

// ── CART ──
function addToCart(id){
  const p=all.find(x=>x.id==id);if(!p)return;
  const ex=cart.find(x=>x.id==id);
  if(ex)ex.qty++;else cart.push({id:p.id,name:p.name,price:p.price,image:p.image,qty:1});
  saveCart();updateBadges();
  showToast(`"${p.name}" agregado 🛍️`,'success');
  const b=document.getElementById('cartBtn');b.style.transform='scale(1.2)';setTimeout(()=>b.style.transform='',250);
}
function openCart(){renderCartItems();document.getElementById('cartPanel').classList.add('show');document.getElementById('overlay').classList.add('show');}
function closeCart(){
  document.getElementById('cartPanel').classList.remove('show');
  document.getElementById('overlay').classList.remove('show');
  setNav('navHome');
}
function renderCartItems(){
  const c=document.getElementById('cartItems');
  if(!cart.length){c.innerHTML=`<div class="empty-state" style="padding:60px 20px"><i class='bx bx-cart'></i><p>Tu carrito está vacío</p></div>`;document.getElementById('cartTotal').textContent='$0';return;}
  c.innerHTML=cart.map(i=>`
    <div class="cart-item">
      <div class="cart-item-img placeholder"><i class='bx bx-image'></i></div>
      <div class="cart-item-info"><h4>${i.name}</h4><span class="item-price">${fmt(i.price)} c/u</span></div>
      <div class="cart-qty">
        <button class="qty-btn" onclick="changeQty('${i.id}',-1)">−</button>
        <span class="qty-num">${i.qty}</span>
        <button class="qty-btn" onclick="changeQty('${i.id}',1)">+</button>
      </div>
      <button class="remove-item" onclick="removeFromCart('${i.id}')"><i class='bx bx-trash'></i></button>
    </div>`).join('');
  document.getElementById('cartTotal').textContent=fmt(cart.reduce((s,i)=>s+i.price*i.qty,0));
}
function changeQty(id,d){const i=cart.find(x=>x.id==id);if(!i)return;i.qty+=d;if(i.qty<=0)removeFromCart(id);else{saveCart();updateBadges();renderCartItems();}}
function removeFromCart(id){cart=cart.filter(x=>x.id!=id);saveCart();updateBadges();renderCartItems();}
function saveCart(){localStorage.setItem('cart',JSON.stringify(cart));}
function updateBadges(){
  const n=cart.reduce((s,i)=>s+i.qty,0);
  ['cartBadge','cartBadgeMobile'].forEach(id=>{const b=document.getElementById(id);if(b){b.textContent=n;b.classList.toggle('show',n>0);}});
  const nd=document.getElementById('navDot');if(nd){nd.textContent=n;nd.classList.toggle('show',n>0);}
}

// ── WHATSAPP ──
function sendWhatsApp(){
  if(!cart.length){showToast('Tu carrito está vacío','error');return;}
  const lines=cart.map(i=>`- ${i.name} x${i.qty} = ${fmt(i.price*i.qty)}`).join('\n');
  const total=cart.reduce((s,i)=>s+i.price*i.qty,0);
  const msg=`Hola! Quiero realizar este pedido:\n\n${lines}\n\n*Total: ${fmt(total)}*\n\n¿Me confirmas disponibilidad?`;
  window.open(`https://wa.me/${CONFIG.WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`,'_blank');
}

// ── ADMIN LOGIN ──
function closeAdminLogin(){document.getElementById('adminLoginOverlay').classList.remove('show');}
async function doLogin(){
  const u=document.getElementById('loginUser').value.trim();
  const p=document.getElementById('loginPass').value;
  if(!u||!p){showToast('Completa todos los campos','error');return;}
  let ok=(u===CONFIG.ADMIN_USER&&p===CONFIG.ADMIN_PASS);
  if(isConfigured&&!ok){try{const r=await fetch(CONFIG.APPS_SCRIPT_URL+`?action=login&user=${u}&pass=${p}`);ok=(await r.json()).success;}catch(e){}}
  if(ok){sessionStorage.setItem('adminLogged','true');closeAdminLogin();openAdminPanel();}
  else{showToast('Credenciales incorrectas','error');document.getElementById('loginPass').value='';}
}

// ── ADMIN PANEL ──
function openAdminPanel(){document.getElementById('adminPanel').classList.add('show');renderAdminGrid();}
function exitAdmin(){sessionStorage.removeItem('adminLogged');document.getElementById('adminPanel').classList.remove('show');}
function renderAdminGrid(){
  const g=document.getElementById('adminGrid');
  if(!all.length){g.innerHTML=`<div class="empty-state" style="grid-column:1/-1"><i class='bx bx-package'></i><p>No hay productos</p></div>`;return;}
  g.innerHTML=all.map((p,i)=>`
    <div class="admin-card" style="animation-delay:${i*.06}s">
      <div class="admin-card-img">${p.image?`<img src="${p.image}" alt="${p.name}" onerror="this.style.display='none'">`:`<div class="placeholder-icon"><i class='bx bx-image'></i></div>`}</div>
      <div class="admin-card-body">
        <span class="cat-tag">${p.category||'Sin categoría'}</span>
        <h3>${p.name}</h3><div class="p-price">${fmt(p.price)}</div>
        <div class="admin-card-actions">
          <button class="btn-edit" onclick="editProduct('${p.id}')"><i class='bx bx-edit'></i>Editar</button>
          <button class="btn-delete" onclick="deleteProduct('${p.id}')"><i class='bx bx-trash'></i></button>
        </div>
      </div>
    </div>`).join('');
}

// ── CRUD ──
function openProductModal(id){
  editingId=id||null;imgB64=null;
  document.getElementById('modalTitle').textContent=id?'Editar producto':'Nuevo Producto';
  ['pName','pPrice','pCategory','pDesc','pImgUrl'].forEach(x=>document.getElementById(x).value='');
  resetUploadZone();
  if(id){const p=all.find(x=>x.id==id);if(p){document.getElementById('pName').value=p.name;document.getElementById('pPrice').value=p.price;document.getElementById('pCategory').value=p.category||'';document.getElementById('pDesc').value=p.description||'';document.getElementById('pImgUrl').value=p.image||'';}}
  document.getElementById('productModal').classList.add('show');
}
function closeProductModal(){document.getElementById('productModal').classList.remove('show');}
function editProduct(id){openProductModal(id);}
async function deleteProduct(id){
  const r=await Swal.fire({title:'¿Eliminar?',text:'No se puede deshacer.',icon:'warning',showCancelButton:true,confirmButtonText:'Sí, eliminar',cancelButtonText:'Cancelar',confirmButtonColor:'#ff6b9d'});
  if(!r.isConfirmed)return;
  if(isConfigured){try{await fetch(CONFIG.APPS_SCRIPT_URL,{method:'POST',body:JSON.stringify({action:'delete',id})});}catch(e){}}
  all=all.filter(x=>x.id!=id);filtered=filtered.filter(x=>x.id!=id);
  renderAdminGrid();buildFilters();renderProducts(filtered);showToast('Producto eliminado','success');
}
async function saveProduct(){
  const name=document.getElementById('pName').value.trim();
  const price=parseFloat(document.getElementById('pPrice').value);
  const category=document.getElementById('pCategory').value.trim();
  const description=document.getElementById('pDesc').value.trim();
  let image=document.getElementById('pImgUrl').value.trim();
  if(!name||!price){showToast('Nombre y precio requeridos','error');return;}
  if(imgB64&&isConfigured){try{const res=await fetch(CONFIG.APPS_SCRIPT_URL,{method:'POST',body:JSON.stringify({action:'uploadImage',imageData:imgB64,filename:name.replace(/\s+/g,'_')})});const d=await res.json();if(d.success)image=d.url;}catch(e){}}
  else if(imgB64)image=imgB64;
  const prod={name,price,category,description,image};
  if(isConfigured){try{const body=editingId?{action:'update',id:editingId,...prod}:{action:'create',...prod};const res=await fetch(CONFIG.APPS_SCRIPT_URL,{method:'POST',body:JSON.stringify(body)});const d=await res.json();if(d.success)prod.id=d.id||editingId;}catch(e){}}
  if(editingId){const i=all.findIndex(x=>x.id==editingId);if(i>=0)all[i]={...all[i],...prod};const j=filtered.findIndex(x=>x.id==editingId);if(j>=0)filtered[j]={...filtered[j],...prod};showToast('Actualizado ✓','success');}
  else{prod.id=Date.now().toString();all.unshift(prod);filtered.unshift(prod);showToast('Creado ✓','success');}
  closeProductModal();renderAdminGrid();buildFilters();renderProducts(filtered);
}

// ── IMAGE ──
function triggerFileInput(){document.getElementById('imgInput').click();}
function previewImage(e){
  const f=e.target.files[0];if(!f)return;
  if(f.size>5*1024*1024){showToast('Imagen muy grande (máx 5MB)','error');return;}
  const r=new FileReader();
  r.onload=ev=>{imgB64=ev.target.result;document.getElementById('uploadZone').innerHTML=`<img class="img-preview" src="${imgB64}" alt="preview"><input type="file" id="imgInput" accept="image/*" onchange="previewImage(event)" style="position:absolute;inset:0;opacity:0;cursor:pointer">`;};
  r.readAsDataURL(f);
}
function resetUploadZone(){document.getElementById('uploadZone').innerHTML=`<i class='bx bx-image-add'></i><span>Toca para subir imagen</span><span style="font-size:11px;color:#c0b8e0">PNG, JPG · Máx 5MB</span><input type="file" id="imgInput" accept="image/*" onchange="previewImage(event)">`;}

// ── HELPERS ──
function fmt(n){return'$'+Math.round(n).toLocaleString('es-CO');}
function showToast(msg,type='info'){
  const c=document.getElementById('toastContainer');
  const t=document.createElement('div');t.className=`toast ${type}`;
  const ic=type==='success'?'bx-check-circle':type==='error'?'bx-x-circle':'bx-info-circle';
  t.innerHTML=`<i class='bx ${ic}' style="font-size:18px;color:${type==='success'?'#25d366':type==='error'?'#ff6b9d':'var(--primary-dark)'}"></i>${msg}`;
  c.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(20px)';t.style.transition='.3s';setTimeout(()=>t.remove(),300);},3000);
}
document.getElementById('productModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closeProductModal();});
</script>
